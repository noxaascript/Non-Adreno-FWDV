# ============================================================
#  vkd3d_proton.conf — VKD3D-Proton D3D12 configuration
#  FexDXVK NonAdreno | Non-Adreno GPU optimizations
#  Target: Winlator GameHub | FexCore-2607-custom
# ============================================================
# Set via: VKD3D_CONFIG=<path> or VKD3D_DEBUG=<level>

# ----- Queue Configuration -----
# Use a single unified queue on Mali (some drivers expose limited queues)
# Options: single_queue, multi_queue
VKD3D_QUEUE_FAMILY=single_queue

# Async compute queue — enable on G610/G720 which support it well
# On G57/G68 this can cause driver stalls; disable if unstable
VKD3D_ASYNC_COMPUTE=1

# ----- Memory -----
# Memory budget hint in MB (0 = driver decides)
# Set to ~70% of total VRAM/shared RAM for typical 4GB devices
VKD3D_MEMORY_BUDGET=2048

# Use host-visible, device-local memory where available
# (common on ARM unified memory architecture)
VKD3D_USE_HOST_IMPORT=1

# ----- Pipeline & Shader -----
# Enable pipeline library (persistent compiled pipeline cache)
VKD3D_PIPELINE_LIBRARY=1

# Shader cache directory
VKD3D_SHADER_CACHE_PATH=/tmp/fexdxvk_cache/vkd3d

# Number of shader compiler threads (0 = auto)
VKD3D_SHADER_COMPILER_THREADS=0

# ----- Non-Adreno Compatibility -----
# Disable Adreno-specific memory allocation paths
VKD3D_DISABLE_ADRENO_MEMORY=1

# Force descriptor heap model compatible with Mali driver
# Options: native, emulated
VKD3D_DESCRIPTOR_HEAP_MODEL=emulated

# Disable MSAA resolve fallback that trips Mali validation layers
VKD3D_DISABLE_MSAA_RESOLVE=0

# ----- Performance -----
# Submit command lists in batches for reduced CPU overhead
VKD3D_SUBMIT_BATCH_SIZE=16

# Frame latency (lower = more responsive but higher CPU load)
VKD3D_MAX_FRAME_LATENCY=2

# ----- Debug -----
# 0=none 1=error 2=warn 3=info 4=debug
VKD3D_DEBUG=1
