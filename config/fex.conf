# ============================================================
#  fex.conf — FexCore-2607 ARM64 build configuration
#  x86/x86_64 → ARM64 JIT via FEX-Emu
# ============================================================

[Core]
CoreVersion = 2607
JITSize = 8192
SMCEnable = 0
JITThreads = 0
ThreadMigrationThreshold = 1

[CPU]
CPUFamily = sandybridge
TSOEnabled = 1
CPUIDOverride = 1
EnableSSE4 = 1

[Memory]
GuestMemoryLimit = 3072
THPEnable = 1
JITCodeCacheSize = 256
SharedMemoryOptimize = 1

[Threading]
ThreadPoolEnable = 1
ThreadPoolMaxSize = 16
SpinWaitOptimize = 1
WorkerAffinityMask = 0

[Thunks]
ThunkEnable = 1
ThunkPath = /usr/lib/fex-emu/thunks
ThunkLibraries = libGL.so.1,libvulkan.so.1,libSDL2.so,libopenal.so.1

[Vulkan]
NativeVulkan = 1
VulkanBypassLayers = 0

[Logging]
LogLevel = 1
LogFile = ""
