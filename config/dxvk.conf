# ============================================================
#  dxvk.conf — FexDXVK NonAdreno v3.0.2
#  Optimized for Mali / PowerVR GPUs on ARM (via FEX-Emu)
# ============================================================

# Async shader compilation — eliminates first-use stutter
dxvk.enableAsync = True
dxvk.numCompilerThreads = 0

# Persistent pipeline cache
dxvk.enableGraphicsPipelineLibrary = True
dxvk.pipelineCompilerOptimizations = True

# Command buffer chunk size (larger = less per-draw overhead on Mali)
dxvk.maxChunkSize = 4

# Frame pacing
dxvk.presentInterval = 1
dxvk.latencySleep = True
dxvk.latencySleepDelay = 0

# Non-Adreno driver fixes
dxvk.useRawSsbo = True
dxvk.invariantPosition = True
dxvk.zeroWorkgroupMemory = False
dxvk.nativeUnorderedAccessViews = True

# D3D9
d3d9.maxFrameRate = 0
d3d9.presentInterval = 1
d3d9.numBackBuffers = 2
d3d9.numFramesInFlight = 2
d3d9.strictPow = True

# D3D11
d3d11.maxFrameLatency = 1
d3d11.numBackBuffers = 2
d3d11.syncInterval = 1

# Logging (set to "debug" for troubleshooting)
dxvk.logLevel = warn
dxvk.logPath = ""
