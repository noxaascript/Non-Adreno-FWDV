# VKD3D-Proton 3.0.1 compatibility profile for the F1 2014 wrapper
# F1 2014 is D3D9; these files are included for wrapper completeness.

VKD3D_QUEUE_FAMILY=single_queue
VKD3D_ASYNC_COMPUTE=0
VKD3D_MEMORY_BUDGET=1536
VKD3D_USE_HOST_IMPORT=1
VKD3D_PIPELINE_LIBRARY=1
VKD3D_SHADER_CACHE_PATH=/tmp/f1-2014-fexdxvk-cache/vkd3d
VKD3D_SHADER_COMPILER_THREADS=1
VKD3D_DISABLE_ADRENO_MEMORY=1
VKD3D_DESCRIPTOR_HEAP_MODEL=emulated
VKD3D_SUBMIT_BATCH_SIZE=8
VKD3D_MAX_FRAME_LATENCY=1
VKD3D_DEBUG=1