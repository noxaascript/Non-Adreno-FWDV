# F1 2014 / DXVK 3.0.2 — Mali/PowerVR cool high-quality profile

# Async compilation reduces first-lap shader stalls without creating a large
# compiler storm on mobile CPUs.
dxvk.enableAsync = True
dxvk.numCompilerThreads = 2
dxvk.enableStateCache = True
dxvk.stateCachePath = ""
dxvk.enableGraphicsPipelineLibrary = True
dxvk.pipelineCompilerOptimizations = True

# Moderate allocations are safer for tile-based mobile GPUs.
dxvk.maxChunkSize = 2
dxvk.maxFrameLatency = 1
dxvk.presentInterval = 1
dxvk.latencySleep = False

# Non-Adreno compatibility.
dxvk.invariantPosition = True
dxvk.zeroWorkgroupMemory = False
dxvk.nativeUnorderedAccessViews = True
dxvk.useRawSsbo = False

# F1 2014 uses D3D9; keep two backbuffers and a stable cadence.
d3d9.maxFrameRate = 60
d3d9.presentInterval = 1
d3d9.numBackBuffers = 2
d3d9.numFramesInFlight = 2
d3d9.strictPow = True

# Keep diagnostic logging quiet during play.
dxvk.logLevel = warn
dxvk.logPath = ""