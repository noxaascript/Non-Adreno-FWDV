# FEX-Emu 2607 — F1 2014 cool/stable profile

[Core]
CoreVersion = 2607
JITSize = 4096
SMCEnable = 0
JITThreads = 0
ThreadMigrationThreshold = 2

[CPU]
CPUFamily = sandybridge
TSOEnabled = 1
CPUIDOverride = 1
EnableSSE4 = 1

[Memory]
GuestMemoryLimit = 2048
THPEnable = 1
JITCodeCacheSize = 192
SharedMemoryOptimize = 1

[Threading]
ThreadPoolEnable = 0
ThreadPoolMaxSize = 4
SpinWaitOptimize = 1
WorkerAffinityMask = 0

[Thunks]
ThunkEnable = 1
ThunkPath = /usr/lib/fex-emu/thunks
ThunkLibraries = libGL.so.1,libvulkan.so.1,libSDL2.so,libopenal.so.1

[Vulkan]
NativeVulkan = 1
VulkanBypassLayers = 0

[Logging]
LogLevel = 1
LogFile = ""